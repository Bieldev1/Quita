name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Vue + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://quita-api.onrender.com

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend (.NET 8 — Clean Architecture)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Quita.Api   # solution root

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Quita.sln

      - name: Build
        run: dotnet build Quita.sln --no-restore -c Release

      - name: Test
        run: |
          if [ -f "tests/Quita.Tests/Quita.Tests.csproj" ]; then
            dotnet test tests/Quita.Tests/Quita.Tests.csproj \
              --no-build -c Release --verbosity normal \
              --logger "trx;LogFileName=results.trx"
          else
            echo "Nenhum projeto de testes encontrado — pulando."
          fi
